# Deploys the static portfolio to GitHub Pages.
# Reference: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
name: Deploy static site to GitHub Pages

on:
  # Deploy on every push to the default branch
  push:
    branches: [main]

  # Allow manual re-deploys from the Actions tab (no commit needed)
  workflow_dispatch:

# Least privilege: read the repo, publish to Pages, request an OIDC token.
# Both "pages: write" and "id-token: write" are required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time. In-progress runs are allowed to finish so a
# production deploy is never cancelled halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Only the built output is published: no sources, scripts or notes.
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
